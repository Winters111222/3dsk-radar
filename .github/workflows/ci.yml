name: Radar CI

on:
  pull_request:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact-revision metadata
        env:
          COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          CONTEXT: ci
          RADAR_ARTIFACT_PROVENANCE: CI_TESTED_SOURCE
          RADAR_ACCEPTANCE_PROFILE: PAID_FOCUSED
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Validate source research catalog (offline)
        run: npm run sources:check
      - name: Run zero-cost fixture acceptance
        run: npm run accept:fixture
      - name: Run static HTTP smoke acceptance
        run: npm run accept:http
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          for file in src/app.js src/lib/*.mjs src/server/*.mjs netlify/functions/*.mjs scripts/*.mjs; do
            node --check "$file"
          done
      - name: Package tested source
        run: |
          git archive --format=tar -o radar-source.tar HEAD
          tar --append --file radar-source.tar build-metadata.json
          gzip -9 radar-source.tar
      - name: Upload tested source
        uses: actions/upload-artifact@v4
        with:
          name: radar-prelive-source
          path: radar-source.tar.gz
          if-no-files-found: error
          retention-days: 7
