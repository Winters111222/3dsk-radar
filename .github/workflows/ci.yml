name: Radar CI

on:
  pull_request:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Finalize lockfile and fixture outreach parity
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/prelive-zero-cost-acceptance-20260905'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()
          s = s.replace('subject:null,opportunity_id:item.id', 'subject:item.reply_subject||null,opportunity_id:item.id')
          p.write_text(s)
          PY
          git add package-lock.json src/app.js
          if git diff --cached --quiet; then
            echo "No deterministic source changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Lock dependencies and align fixture outreach history"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Run tests
        run: npm test
      - name: Run zero-cost fixture acceptance
        run: npm run accept:fixture
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          for file in src/app.js src/lib/*.mjs src/server/*.mjs netlify/functions/*.mjs scripts/*.mjs; do
            node --check "$file"
          done
      - name: Package tested source
        run: git archive --format=tar.gz -o radar-source.tar.gz HEAD
      - name: Upload tested source
        uses: actions/upload-artifact@v4
        with:
          name: radar-prelive-source
          path: radar-source.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Prepare isolated Netlify deploy helper
        run: |
          npm install --ignore-scripts --no-save --no-audit --no-fund @netlify/mcp@1.15.1
          tar -czf netlify-mcp-runtime.tar.gz node_modules
      - name: Upload Netlify deploy helper
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-runtime
          path: netlify-mcp-runtime.tar.gz
          if-no-files-found: error
          retention-days: 1
